// this compat fix is literally just for me and my top mounted shuttle lmao

KSP_TEXTURE_SET:NEEDS[TexturesUnlimited&ORANGES]
{
    name = SORK_stock_ORANGES_adapter3125
    title = Stock
    recolorable = false
    MATERIAL
    {
        mode = update
        shader = KSP/Bumped Specular
        mesh = shuttle-c-adapter
        mesh = shuttle-c-adapter (1)
        texture = _MainTex,ORANGES/Parts/Sidemount/oranges-shuttle-c-3
        texture = _BumpMap,ORANGES/Parts/Sidemount/oranges-shuttle-c-3_NRM
    }
}

KSP_TEXTURE_SET:NEEDS[TexturesUnlimited&ORANGES]
{
    name = SORK_recolor_ORANGES_adapter3125
    title = Recolor
    recolorable = true
    MATERIAL
    {
        mode = update
        shader = TU/Metallic
        mesh = shuttle-c-adapter
        mesh = shuttle-c-adapter (1)
        keyword = TU_RECOLOR
        texture = _MainTex,ORANGES/Parts/Sidemount/oranges-shuttle-c-3
        texture = _BumpMap,ORANGES/Parts/Sidemount/oranges-shuttle-c-3_NRM
        texture = _MaskTex,KVX-SORK/Masks/ORANGES/oranges-shuttle-c-3_moon
        texture = _MetallicGlossMap,KVX-SORK/Masks/flat_gloss
        vector = _DiffuseNorm,0.763,0.18,0.5
        vector = _MetalNorm,0,0,0
        vector = _SmoothnessNorm,0,0,0
        PROPERTY { name = _Metal      float = 0.0 }
        PROPERTY { name = _Smoothness float = 0.0 }
    }
    COLORS
    {
        mainColor = orange
        secondColor = white
        detailColor = white
    }
}

